<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <style>

        /*body {
            background-image: url("mcu.jpg");
            background-attachment: fixed; /*para di gumalaw o mag distort ung img pag may other elements na sa html*/
            /*background-size: cover;
            
            
        }*/

       .container { /*parent*/
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90vh;
    gap: 220px; /* increased space between logo and visitor card */
    flex-wrap: wrap;
}

        .visitor_card {
            position: relative;
            background-color: #4a265e;
            padding: 5px;
            min-width: 500px;
            min-height: 300px;
            border-radius: 20px;
            filter: drop-shadow(0 0 15px #c4c3c3);
            transition: width 0.3s, height 0.3s, filter 0.3s;
        }

        /*.visitor_card:hover {
            width: 480px;
            height: 380px;
            filter: drop-shadow(0 0 15px #817f7f);
 
        }*/

        .title {
            font-family: "DM Sans", sans-serif;
            text-align: center;
            font-weight: 1000;
            font-size: 40px;
            color: #fcb828;
            padding-top: 10px;
            
        }

        .titletext {
          font-family: "DM Sans", sans-serif;
            text-align: center;
            font-size: 17px; 
            color: white;
            max-width: 400px;
            margin: 40px auto 0;
            overflow-wrap: break-word;
        }

        /*--SUBTITLE--*/
        .subtitle {
            font-family: "DM Sans", sans-serif;
            text-align: center;
            font-size: 20px;
            /* color: #4a265e; */
            background-color: white;
            padding: 15px;
            border-radius: 20px;
            margin-top: 60px;
            max-width: 300px;
            margin: 60px auto 0;
            overflow-wrap: break-word;
        }

        .btn_container {
           position: relative;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
        }

        .register_btn {
            width: 400px;
            padding: 10px;
            font-size: large;
            border-radius: 20px;
            font-family: "DM Sans", sans-serif;
            font-weight: 1000;
            padding: 12px;
            color: #4a265e;
        }

        
        /*--LINK--*/
        /* a { 
            text-decoration: underline;
        }*/

        a:hover {
            color: #fcb828;
        }

        /* MCU LOGO */
        .logo {
            width: 400px;
        }
    </style>

</head>
<body>
 

<!-- VISITOR LOGIN CARD -->
<div class="container">

    <!-- MCU LOGO PART -->
    <div class="subtitle_container">
        <img src="Copy of MCU_Logo.png" class="logo">
    </div>


    <!-- VISITOR LOGIN CARD -->
    <div class="visitor_card">
        
            <p class="title">VISITOR LOGIN</p>
            <p class="titletext">Manila Central University's digital visitor log book.</p>

            <div class="btn_container">
                <button onclick="window.location.href='logbook_form.html';" class="register_btn">REGISTER</button>
            </div>
    </div>
</div>

</body>
</html>
